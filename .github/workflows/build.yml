name: Build and Publish

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate contract types
        run: npm run generate:spec

      - name: Setup Biome
        uses: biomejs/setup-biome@v2

      - name: Run Biome
        run: biome ci . --error-on-warnings

      - name: Run typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Extract version
        run: |
          echo "TAG=$(jq -r '.version' package.json)" >> $GITHUB_ENV

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          tags: |
            type=semver,pattern={{version}},value=v${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.TAG }}
            type=semver,pattern=v{{major}},value=v${{ env.TAG }}

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: lamington-extractor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify healthcheck
        run: |
          docker run -d --name extractor -p 3001:3001 \
            -e EXTRACTOR_API_KEY=test-secret \
            lamington-extractor:ci
          for i in {1..30}; do
            status=$(docker inspect --format='{{.State.Health.Status}}' extractor)
            if [ "$status" = "healthy" ]; then
              echo "Container is healthy"
              exit 0
            fi
            if [ "$status" = "unhealthy" ]; then
              docker logs extractor
              exit 1
            fi
            sleep 2
          done
          docker logs extractor
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f extractor || true

  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [quality, build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        run: |
          echo "TAG=$(jq -r '.version' package.json)" >> $GITHUB_ENV

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          tags: |
            type=semver,pattern={{version}},value=v${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ env.TAG }}
            type=semver,pattern=v{{major}},value=v${{ env.TAG }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
